<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Podium</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Autoplay-policy gate: must be tapped before any Web Audio sound will play -->
<div id="gate" class="gate">
  <div class="spray-cloud cloud-1" aria-hidden="true"></div>
  <div class="spray-cloud cloud-2" aria-hidden="true"></div>
  <div class="spray-cloud cloud-3" aria-hidden="true"></div>
  <div class="tag-scribble scribble-1" aria-hidden="true">★</div>
  <div class="tag-scribble scribble-2" aria-hidden="true">EST. 2026</div>
  <div class="gate-inner">
    <div class="gate-mark-ring">
      <div class="gate-mark" id="gate-mark"></div>
    </div>
    <h1 class="gate-wordmark">PODIUM</h1>
    <p class="gate-sub">Classroom Championship</p>
    <button id="gate-enter" class="btn btn-primary btn-huge">Enter Podium</button>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <a href="#/dashboard" class="brand">
      <span id="header-mark" class="header-mark"></span>
      <span class="brand-word">PODIUM</span>
    </a>
    <button id="nav-toggle" class="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="nav-links"></nav>
    <div class="topbar-right">
      <div class="week-pill" id="week-pill">Week —</div>
      <div id="user-badge" class="user-badge hidden"></div>
    </div>
  </header>

  <main id="screen" class="screen"></main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
